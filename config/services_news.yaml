# Loaded by ContaoAiBackendBundle::loadExtension() only when \Contao\NewsModel
# (contao/news-bundle) is installed. Otherwise autowiring would break at the
# NewsCreate/Read/Update/DeleteCommand constructor (which ContaoAiCoreBundle in
# turn registers only conditionally, via class_exists).
services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    # Auto-tag every rewriter from this file. _instanceof applies per file only,
    # hence repeated here (same pattern as services_*.yaml for cloners in the core bundle).
    _instanceof:
        Webwerkwien\ContaoAiBackendBundle\Service\Rewriter\EntityRewriterInterface:
            tags: ['contao_ai_backend.entity_rewriter']

    Webwerkwien\ContaoAiBackendBundle\Tool\NewsTool:
        # _instanceof from services.yaml does not apply here (per-file scope),
        # hence the explicit tag.
        tags: ['contao_ai_backend.tool']

    Webwerkwien\ContaoAiBackendBundle\Service\Rewriter\NewsRewriter: ~
