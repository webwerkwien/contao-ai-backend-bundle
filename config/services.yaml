services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    Webwerkwien\ContaoAiBackendBundle\:
        resource: '../src/'
        # Plugin-conditional tools are registered in services_<plugin>.yaml as
        # soon as the respective contao bundle is installed (see
        # ContaoAiBackendBundle::loadExtension). They MUST be excluded here as
        # well.
        #
        # 🔴 Exactly this was missing for EventTool and FaqTool (v0.6.0/v0.7.0)
        # and broke the container build on a live installation:
        #
        #   Cannot autowire "…Tool\FaqTool": argument "$createCommand" needs
        #   "…Command\FaqCreateCommand" but this type has been excluded
        #
        # 🎯 The class_exists guard in loadExtension() only prevents the
        # *additional* registration — it does not take the class out of
        # auto-discovery. Without an entry here the tool is always built, even
        # where its command is missing. The guard looks sufficient. It is only
        # half of it.
        #
        # The same installation provided the counter-check: the news bundle is
        # missing there too, and NewsTool stayed quiet — because it is listed below.
        exclude:
            - '../src/{ContaoAiBackendBundle.php,ContaoManager,Exception,Service/AgentInvocation.php,Service/UserAiConfigDto.php,Resources}'
            # Built where used (v0.14.1): a second LoggerInterface service in the
            # container would only invite the wrong autowiring.
            - '../src/Security/{ArgumentMaskingLogger.php,ToolArgumentMasker.php}'
            - '../src/Tool/NewsTool.php'
            - '../src/Tool/EventTool.php'
            - '../src/Tool/FaqTool.php'
            # Rewriter infrastructure is plugin-conditional; registered per plugin
            # in services_<plugin>.yaml. The interface itself is never needed as a
            # service (only as a type hint in the tagged iterator).
            - '../src/Service/Rewriter/EntityRewriterInterface.php'
            - '../src/Service/Rewriter/News*.php'
            - '../src/Service/Rewriter/Event*.php'
            - '../src/Service/Rewriter/Faq*.php'

    Webwerkwien\ContaoAiBackendBundle\Controller\:
        resource: '../src/Controller/'
        public: true
        tags: ['controller.service_arguments']

    Webwerkwien\ContaoAiBackendBundle\Controller\AiStreamController:
        autowire: true
        public: true
        tags: ['controller.service_arguments']
        arguments:
            $csrfTokenName: '%contao.csrf_token_name%'
            $projectDir: '%kernel.project_dir%'

    # HTTP bridge for the Python CLI agent. Bearer token auth, no CSRF,
    # stateless. Reuses the existing macro tools via a direct service call with
    # a programmatically set security token.
    Webwerkwien\ContaoAiBackendBundle\Controller\CliBridgeController:
        autowire: true
        public: true
        tags: ['controller.service_arguments']
        arguments:
            $projectDir: '%kernel.project_dir%'

    # Token generation in the back-end profile. Back-end session auth
    # (Contao's standard firewall), CSRF via REQUEST_TOKEN.
    Webwerkwien\ContaoAiBackendBundle\Controller\AiCliTokenController:
        autowire: true
        public: true
        tags: ['controller.service_arguments']
        arguments:
            $csrfTokenName: '%contao.csrf_token_name%'

    # DCA input_field_callback. Public, because Contao's legacy callback
    # resolver instantiates the service by ID and cannot reach a non-public one.
    Webwerkwien\ContaoAiBackendBundle\Dca\TlUserCallback:
        autowire: true
        public: true

    Webwerkwien\ContaoAiBackendBundle\Service\SystemPromptProvider:
        arguments:
            $promptFile: '%kernel.project_dir%/vendor/webwerkwien/contao-ai-backend-bundle/src/Resources/prompts/system.md'

    # RecordRewriteTool always loads (no plugin condition); the plugin-conditional
    # update commands (news/event/faq) come in optionally via '@?' — null when
    # the respective contao bundle is not installed. The tool then refuses
    # gracefully at runtime. Page/article/content update are part of
    # contao/core-bundle and always there.
    Webwerkwien\ContaoAiBackendBundle\Tool\RecordRewriteTool:
        autowire: true
        autoconfigure: true
        arguments:
            $newsUpdate:    '@?Webwerkwien\ContaoAiCoreBundle\Command\NewsUpdateCommand'
            $eventUpdate:   '@?Webwerkwien\ContaoAiCoreBundle\Command\EventUpdateCommand'
            $faqUpdate:     '@?Webwerkwien\ContaoAiCoreBundle\Command\FaqUpdateCommand'
            $pageUpdate:    '@?Webwerkwien\ContaoAiCoreBundle\Command\PageUpdateCommand'
            $articleUpdate: '@?Webwerkwien\ContaoAiCoreBundle\Command\ArticleUpdateCommand'
            $contentUpdate: '@?Webwerkwien\ContaoAiCoreBundle\Command\ContentUpdateCommand'

    _instanceof:
        Webwerkwien\ContaoAiBackendBundle\Tool\AbstractCoreCommandTool:
            tags: ['contao_ai_backend.tool']
        # Page/article/content rewriters are not plugin-conditional — auto-tagged
        # centrally here instead of in plugin files. Plugin-conditional rewriters
        # have their own _instanceof in services_news/calendar/faq.yaml.
        Webwerkwien\ContaoAiBackendBundle\Service\Rewriter\EntityRewriterInterface:
            tags: ['contao_ai_backend.entity_rewriter']
