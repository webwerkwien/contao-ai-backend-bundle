services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    Webwerkwien\ContaoAiBackendBundle\:
        resource: '../src/'
        # NewsTool ist plugin-bedingt (\Contao\NewsModel) und wird in
        # services_news.yaml registriert, sobald contao/news-bundle installiert
        # ist (siehe ContaoAiBackendBundle::loadExtension).
        exclude:
            - '../src/{ContaoAiBackendBundle.php,ContaoManager,Exception,Service/AgentInvocation.php,Service/UserAiConfigDto.php,Resources}'
            - '../src/Tool/NewsTool.php'
            # Rewriter-Infrastruktur ist plugin-bedingt; pro Plugin in
            # services_<plugin>.yaml registriert. Das Interface selbst wird
            # nirgends als Service gebraucht (nur als Type-Hint im Tagged-Iterator).
            - '../src/Service/Rewriter/EntityRewriterInterface.php'
            - '../src/Service/Rewriter/News*.php'
            - '../src/Service/Rewriter/Event*.php'
            - '../src/Service/Rewriter/Faq*.php'

    Webwerkwien\ContaoAiBackendBundle\Controller\:
        resource: '../src/Controller/'
        public: true
        tags: ['controller.service_arguments']

    Webwerkwien\ContaoAiBackendBundle\Controller\AiStreamController:
        autowire: true
        public: true
        tags: ['controller.service_arguments']
        arguments:
            $csrfTokenName: '%contao.csrf_token_name%'
            $projectDir: '%kernel.project_dir%'

    Webwerkwien\ContaoAiBackendBundle\Service\SystemPromptProvider:
        arguments:
            $promptFile: '%kernel.project_dir%/vendor/webwerkwien/contao-ai-backend-bundle/src/Resources/prompts/system.md'

    # Public service consumed by the legacy Contao backend module callback (AiChatModule)
    Webwerkwien\ContaoAiBackendBundle\Service\ChatViewRenderer:
        autowire: true
        public: true

    # Phase 9.3+9.4: RecordRewriteTool lädt immer (kein plugin-condition), die
    # plugin-bedingten Update-Commands (news/event/faq) kommen optional rein über
    # '@?' — null wenn das jeweilige contao-bundle nicht installiert ist. Tool
    # refused zur Laufzeit graceful. Page/Article/Content-Update sind Teil von
    # contao/core-bundle und immer da.
    Webwerkwien\ContaoAiBackendBundle\Tool\RecordRewriteTool:
        autowire: true
        autoconfigure: true
        arguments:
            $newsUpdate:    '@?Webwerkwien\ContaoAiCoreBundle\Command\NewsUpdateCommand'
            $eventUpdate:   '@?Webwerkwien\ContaoAiCoreBundle\Command\EventUpdateCommand'
            $faqUpdate:     '@?Webwerkwien\ContaoAiCoreBundle\Command\FaqUpdateCommand'
            $pageUpdate:    '@?Webwerkwien\ContaoAiCoreBundle\Command\PageUpdateCommand'
            $articleUpdate: '@?Webwerkwien\ContaoAiCoreBundle\Command\ArticleUpdateCommand'
            $contentUpdate: '@?Webwerkwien\ContaoAiCoreBundle\Command\ContentUpdateCommand'

    _instanceof:
        Webwerkwien\ContaoAiBackendBundle\Tool\AbstractCoreCommandTool:
            tags: ['contao_ai_backend.tool']
        # Page/Article/Content-Rewriter sind nicht plugin-bedingt — auto-tag
        # zentral hier statt in Plugin-Files. Plugin-bedingte Rewriter haben
        # ihr eigenes _instanceof in services_news/calendar/faq.yaml.
        Webwerkwien\ContaoAiBackendBundle\Service\Rewriter\EntityRewriterInterface:
            tags: ['contao_ai_backend.entity_rewriter']
