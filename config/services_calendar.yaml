# Loaded by ContaoAiBackendBundle::loadExtension() only when
# \Contao\CalendarEventsModel (contao/calendar-bundle) is installed.
services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    _instanceof:
        Webwerkwien\ContaoAiBackendBundle\Service\Rewriter\EntityRewriterInterface:
            tags: ['contao_ai_backend.entity_rewriter']

    # _instanceof from services.yaml does not apply here (per-file scope),
    # hence the explicit tag — as with NewsTool.
    Webwerkwien\ContaoAiBackendBundle\Tool\EventTool:
        tags: ['contao_ai_backend.tool']

    Webwerkwien\ContaoAiBackendBundle\Service\Rewriter\EventRewriter: ~
